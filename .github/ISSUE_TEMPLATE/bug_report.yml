name: Bug report
description: Something in Hush isn't working as expected
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: e.g. macOS 26.6
      placeholder: macOS 26.x
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac
      description: Chip and RAM, e.g. "M1, 16 GB"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: The commit you built from (git rev-parse HEAD)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order. Do not include transcript text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Output of:
          log show --info --last 10m --predicate 'subsystem == "com.local.hush"'
        Logs contain timings and states only — never transcript text.
      render: shell
    validations:
      required: false
